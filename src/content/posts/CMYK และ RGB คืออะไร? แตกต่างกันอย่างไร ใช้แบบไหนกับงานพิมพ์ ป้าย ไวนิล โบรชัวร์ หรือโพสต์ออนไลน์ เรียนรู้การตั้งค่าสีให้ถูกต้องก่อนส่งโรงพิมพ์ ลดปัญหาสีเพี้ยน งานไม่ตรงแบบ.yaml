title: CMYK กับ RGB ต่างกันอย่างไร? คู่มือเลือกโหมดสีสำหรับงานพิมพ์และงานออนไลน์
content: >-
  หลายคนออกแบบ Artwork สวยบนหน้าจอ แต่พอส่งพิมพ์จริงกลับพบว่า “สีเพี้ยน” สีหม่น
  หรือสีสดไม่เหมือนต้นฉบับ ปัญหานี้มักเกิดจากการเลือกโหมดสีผิดระหว่าง CMYK และ
  RGB


  บทความนี้จะอธิบายแบบเข้าใจง่ายว่า CMYK และ RGB คืออะไร ใช้งานต่างกันอย่างไร
  และควรเลือกใช้แบบไหนสำหรับงานพิมพ์และงานออนไลน์


  RGB คืออะไร?


  RGB ย่อมาจาก


  Red (แดง)

  Green (เขียว)

  Blue (น้ำเงิน)


  เป็นระบบสีที่ใช้กับอุปกรณ์แสดงผล เช่น


  หน้าจอคอมพิวเตอร์

  โทรศัพท์มือถือ

  ทีวี

  เว็บไซต์

  Social Media


  RGB จะใช้ “แสง” ในการสร้างสี ทำให้สีดูสด สว่าง และมีความคมชัดสูง


  ตัวอย่างงานที่เหมาะกับ RGB

  โพสต์ Facebook

  Banner Website

  Content Social Media

  Video Content

  Presentation
