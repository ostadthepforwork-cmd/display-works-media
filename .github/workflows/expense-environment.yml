# Isolated contract tests; not production-equivalence or deployment acceptance.
name: Expense isolated environment and SQL checks
on:
  workflow_dispatch:
  push:
    branches: [ci/expense-environment-20260908]
    paths: [.github/workflows/expense-environment.yml, 'tests/expense-isolated/**']
permissions:
  contents: read
concurrency:
  group: expense-environment-readiness
  cancel-in-progress: false
jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      # No repository checkout, project link, production secrets, cache or artifacts.
      - name: Create disposable environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/expense-supabase"
          npx --yes supabase@2.116.0 init --workdir "$RUNNER_TEMP/expense-supabase"
          test ! -e "$RUNNER_TEMP/expense-supabase/supabase/.temp/project-ref"
      - name: Start local Supabase on runner
        shell: bash
        run: |
          set -euo pipefail
          # Suppress CLI output because local-only keys are printed on successful start.
          if ! npx --yes supabase@2.116.0 start --workdir "$RUNNER_TEMP/expense-supabase" > "$RUNNER_TEMP/expense-start.log" 2>&1; then
            echo 'Local Supabase startup failed; raw log withheld to avoid key disclosure.'
            exit 1
          fi
          npx --yes supabase@2.116.0 status --workdir "$RUNNER_TEMP/expense-supabase" > /dev/null 2>&1
          printf '## Environment readiness\nLocal Supabase started on disposable runner. See subsequent SQL and browser test results.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch exact public test source without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ostadthepforwork-cmd/display-works-media'
          test "$GITHUB_REF" = 'refs/heads/ci/expense-environment-20260908'
          git init "$RUNNER_TEMP/expense-source"
          git -C "$RUNNER_TEMP/expense-source" fetch --depth=1 https://github.com/ostadthepforwork-cmd/display-works-media.git "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/expense-source" checkout --detach FETCH_HEAD
      - name: Run synthetic expense SQL and independent-session tests
        shell: bash
        run: node "$RUNNER_TEMP/expense-source/tests/expense-isolated/run.mjs"
      - name: Install isolated browser test tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/expense-browser" --no-save --ignore-scripts --no-audit --no-fund playwright@1.51.1
          node "$RUNNER_TEMP/expense-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Validate built expense application in real browser
        shell: bash
        run: node "$RUNNER_TEMP/expense-source/tests/expense-isolated/browser.mjs"
      - name: Stop disposable local environment
        if: always()
        shell: bash
        run: |
          npx --yes supabase@2.116.0 stop --workdir "$RUNNER_TEMP/expense-supabase" > /dev/null 2>&1
